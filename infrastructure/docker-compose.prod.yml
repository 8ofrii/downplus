version: '3.8'

services:
  # ── 1. Nginx Gateway & Reverse Proxy ──
  nginx:
    image: nginx:alpine
    container_name: downplus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - downplus-network

  # ── 2. NestJS API Core Engine ──
  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    container_name: downplus-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://downplus_user:SuperSecureProdPass2026@postgres:5432/downplus?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=downplus-jwt-prod-secret-super-safe-2026-pediatric-key-32b
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=google/gemini-3.5-flash
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=downplus-minio-admin
      - S3_SECRET_KEY=downplus-minio-super-secret-2026
      - S3_BUCKET_NAME=downplus-medical-records
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - downplus-network

  # ── 3. Next.js Clinician & Admin Web Portal ──
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: downplus-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    depends_on:
      - api
    networks:
      - downplus-network

  # ── 4. PostgreSQL 16 with pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: downplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: downplus_user
      POSTGRES_PASSWORD: SuperSecureProdPass2026
      POSTGRES_DB: downplus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downplus_user -d downplus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - downplus-network

  # ── 5. Redis 7 Cache & Job Broker ──
  redis:
    image: redis:7-alpine
    container_name: downplus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - downplus-network

  # ── 6. MinIO Encrypted Medical Vault ──
  minio:
    image: minio/minio:latest
    container_name: downplus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: downplus-minio-admin
      MINIO_ROOT_PASSWORD: downplus-minio-super-secret-2026
    volumes:
      - minio_data:/data
    networks:
      - downplus-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  downplus-network:
    driver: bridge
